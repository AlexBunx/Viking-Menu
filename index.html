<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VIKING — меню</title>
<meta name="description" content="Меню кафе VIKING, Минск, ул. Карла Маркса, 21. Соберите заказ и покажите официанту.">
<meta property="og:title" content="VIKING — меню">
<meta property="og:description" content="Кафе · бар · кофе. Минск, ул. Карла Маркса, 21">
<meta property="og:image" content="https://alexbunx.github.io/viking-menu/img/hero.jpg">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0e1311">
<link rel="icon" href="img/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Inter:wght@400;500;600&display=swap">
<style>
/* VOICE: тёплый вечерний бар, спокойно и уверенно, без суеты
   IDEA: меню-книжка на тёмном столе при свете лампы, как их фото в Instagram
   PICTURE: шапка с фото зала и логотипом викинга, дальше карточки блюд с их собственными фото
   COLOUR and TYPE: глубокий зелёно-чёрный, кремовый текст, шалфей, клубнично-красный акцент; Oswald + Inter
   LAYOUT: шапка → липкие категории и поиск → список блюд → контакты; на широком экране две колонки */
:root{color-scheme:dark;--bg:#0e1311;--card:#18201c;--line:#26312b;--ink:#efe8dc;--mute:#a6b0a8;--sage:#7f9a88;--red:#d4492f}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:Oswald,Impact,sans-serif;font-weight:600;line-height:1.05;margin:0;letter-spacing:.01em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--red);outline-offset:2px}

.hero{position:relative;min-height:340px;padding:calc(env(safe-area-inset-top) + 20px) max(5vw,18px) 28px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:url(img/hero.jpg) center/cover;filter:saturate(1.1) brightness(.75)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,19,17,.15) 0%,rgba(14,19,17,.55) 50%,var(--bg) 100%)}
.hero>*{position:relative;z-index:1}
.top{position:absolute;top:calc(env(safe-area-inset-top) + 14px);left:max(5vw,18px);right:max(5vw,18px);display:flex;justify-content:flex-end;z-index:2}
.lang{display:flex;background:rgba(14,19,17,.7);border:1px solid var(--line);border-radius:22px;padding:3px;backdrop-filter:blur(8px)}
.lang button{border:0;background:none;min-width:44px;height:36px;border-radius:18px;font-weight:600;font-size:14px;color:var(--mute)}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.brand{display:flex;align-items:center;gap:16px}
.logo{width:76px;height:76px;border-radius:50%;overflow:hidden;flex:none;border:2px solid var(--ink);box-shadow:0 8px 24px rgba(0,0,0,.5)}
.logo img{width:100%;height:100%;object-fit:cover;transform:scale(1.13)}
.hero h1{font-size:clamp(40px,9vw,56px)}
.tag{color:var(--mute);margin:4px 0 0;font-size:15px}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.chip{font-size:13px;padding:6px 11px;border-radius:14px;background:rgba(24,32,28,.85);border:1px solid var(--line);white-space:nowrap}
.chip.warn{border-color:var(--red);color:#ffd9cf}

.bar{position:sticky;top:0;z-index:5;background:rgba(14,19,17,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 0 0}
.search{margin:0 max(5vw,18px) 8px;position:relative}
.search input{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;padding:0 40px 0 14px}
.search input::placeholder{color:var(--mute)}
.search button{position:absolute;right:4px;top:4px;width:36px;height:36px;border:0;background:none;color:var(--mute);font-size:20px;display:none}
.cats{display:flex;gap:6px;overflow-x:auto;padding:2px max(5vw,18px) 10px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;height:38px;padding:0 15px;border-radius:19px;border:1px solid var(--line);background:none;font-size:14px;font-weight:500;white-space:nowrap;color:var(--mute)}
.cats button.on{background:var(--sage);border-color:var(--sage);color:#0e1311}

main{max-width:1100px;margin:0 auto;padding:8px max(5vw,18px) 40px}
section{scroll-margin-top:120px;padding-top:26px}
section h2{font-size:30px;margin-bottom:4px}
.note{color:var(--mute);font-size:14px;margin:0 0 14px}
.list{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
@media(min-width:760px){.list{grid-template-columns:repeat(2,minmax(0,1fr))}}
.item{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;transition:border-color .15s}
.item.sel{border-color:var(--sage)}
.open{display:flex;gap:14px;align-items:stretch;text-align:left;width:100%;background:none;border:0;padding:10px;border-radius:16px;transition:transform .15s}
.open:active{transform:scale(.985)}
.ph{width:96px;height:96px;flex:none;border-radius:12px;overflow:hidden;background:#222c27}
.ph img{width:100%;height:100%;object-fit:cover}
.info{flex:1;min-height:72px;display:flex;flex-direction:column;padding:2px 2px 2px 0}
.info h3{font-size:19px;font-weight:500}
.info p{margin:4px 0 0;color:var(--mute);font-size:14px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{margin-top:auto;padding-top:8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.item .meta{flex-direction:column;align-items:flex-start;gap:0;padding-right:54px}.item.sel .meta{padding-right:126px}
.item>.step{position:absolute;right:10px;bottom:10px}
.w{color:var(--mute);font-size:13px;white-space:nowrap}
.price{font-family:Oswald,sans-serif;font-size:20px;white-space:nowrap}
.step{display:inline-flex;align-items:center;flex:none;border-radius:22px}
.step button{width:44px;height:44px;border-radius:22px;border:0;background:var(--sage);color:#0e1311;font-size:24px;line-height:1;font-weight:500;display:grid;place-items:center}
.step .pl{width:auto;min-width:44px;padding:0 12px;font-size:22px}
.step.on{background:var(--sage);color:#0e1311}
.step.on b{min-width:24px;text-align:center;font-size:17px}
.step.on button{background:none}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:10px;background:var(--red);color:#fff;margin-left:6px;vertical-align:3px;font-family:Inter,sans-serif;font-weight:600}
.off .ph,.off .info,.rows.off{opacity:.45}
.grp{margin:18px 0 8px;font-size:21px;font-weight:500;color:var(--sage)}
.gnote{color:var(--mute);font-size:14px;margin:-4px 0 10px}
.rows{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px 14px}
.row{display:flex;align-items:center;gap:12px;min-height:58px;padding:7px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .n{flex:1}
.vars{color:var(--ink);font-size:16px;display:grid;gap:6px;margin-top:14px}
.vr{display:flex;align-items:center;gap:14px}
.sp{display:flex;align-items:center;gap:14px}
.vars div{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:8px}
.vars .price{font-size:24px}
.empty{text-align:center;color:var(--mute);padding:40px 0;display:none}

.sheet{position:fixed;inset:0;z-index:20;display:none}
.sheet.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.panel{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--card);border-radius:22px 22px 0 0;max-height:92vh;overflow:auto;padding-bottom:calc(env(safe-area-inset-bottom) + 20px);animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media(prefers-reduced-motion:reduce){.panel{animation:none}.open,.item{transition:none}}
.panel .big{aspect-ratio:4/3;background:#222c27;display:grid;place-items:center}
.panel .big img{width:100%;height:100%;object-fit:cover}
.panel .big svg{width:64px;opacity:.3}
.panel .body{padding:18px 20px 0}
.panel .big[style*="none"]+.body{padding-top:64px}
.panel h3{font-size:28px}
.panel p{color:var(--mute);margin:10px 0 0}
.panel .meta{padding-top:16px}
.panel .price{font-size:28px}
.close{position:absolute;top:12px;right:12px;width:44px;height:44px;border-radius:22px;border:0;background:rgba(14,19,17,.75);font-size:22px}
.hint{margin:16px 0 0;font-size:14px;color:var(--mute);border-top:1px solid var(--line);padding-top:14px}

footer{border-top:1px solid var(--line);padding:30px max(5vw,18px) calc(env(safe-area-inset-bottom) + 34px);max-width:1100px;margin:0 auto;display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
@media(min-width:760px){footer{grid-template-columns:repeat(3,minmax(0,1fr))}}
footer h3{font-size:18px;color:var(--sage);margin-bottom:6px;font-weight:500}
footer p{margin:0;color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;height:48px;padding:0 20px;border-radius:24px;background:var(--red);color:#fff;text-decoration:none;font-weight:600;margin-top:10px}
.cartbar{position:fixed;z-index:10;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);max-width:560px;margin:0 auto;height:58px;border:0;border-radius:29px;background:var(--red);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:16px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.cartbar[hidden]{display:none}
.cartbar .price{font-size:22px}
body.hascart{padding-bottom:84px}
.order{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;display:none;padding:calc(env(safe-area-inset-top) + 16px) max(5vw,18px) calc(env(safe-area-inset-bottom) + 30px)}
.order.open{display:block}
.order>*{max-width:640px;margin-inline:auto}
.ohead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.ohead h2{font-size:34px}
.oback{height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--line);background:var(--card)}
.row.ord .x{color:var(--sage);font-weight:600}
.otot{display:flex;justify-content:space-between;align-items:baseline;margin-top:22px;padding-top:16px;border-top:2px solid var(--ink);font-family:Oswald,sans-serif;font-size:26px}
.otot .price{font-size:34px}
.clr{margin-top:22px;height:48px;width:100%;border-radius:24px;border:1px solid var(--line);background:none;color:var(--mute)}
.clr.arm{border-color:var(--red);color:#ffd9cf}
.owarn{border:1px solid var(--red);border-radius:12px;padding:10px 14px;color:#ffd9cf;font-size:14px}
.oempty{color:var(--mute);padding:40px 0;text-align:center}
.demo{grid-column:1/-1;color:var(--mute);font-size:13px}
</style>
</head>
<body>
<header class="hero">
  <div class="top"><div class="lang" role="group" aria-label="Language">
    <button id="l-ru" aria-pressed="true">RU</button><button id="l-en" aria-pressed="false">EN</button>
  </div></div>
  <div class="brand">
    <div class="logo"><img src="img/logo.jpg" alt="VIKING"></div>
    <div><h1>VIKING</h1><p class="tag" data-t="tag">Кафе · бар · кофе</p></div>
  </div>
  <div class="facts">
    <span class="chip" data-t="hours">Пн–Вс 10:00–23:00</span>
    <span class="chip" id="kitchen" data-t="kitchen">Кухня до 21:00</span>
  </div>
</header>

<div class="bar">
  <div class="search"><input id="q" type="search" autocomplete="off" placeholder="Найти блюдо или напиток"><button id="qx" aria-label="Очистить">×</button></div>
  <nav class="cats" id="cats"></nav>
</div>

<main id="menu"></main>
<p class="empty" id="empty" data-t="empty">Ничего не нашлось</p>

<footer>
  <div><h3 data-t="addrH">Адрес</h3><p data-t="addr">Минск, ул. Карла Маркса, 21</p></div>
  <div><h3 data-t="hoursH">Часы работы</h3><p data-t="hoursF">Каждый день 10:00–23:00<br>Кухня до 21:00</p></div>
  <div><h3 data-t="bookH">Бронь столика</h3><p data-t="book">Напишите нам в директ Instagram</p>
    <a class="btn" href="https://instagram.com/viking_official_by" target="_blank" rel="noopener">@viking_official_by</a></div>
  <p class="demo" data-t="demo"></p>
</footer>

<button id="cartbar" class="cartbar" hidden></button>
<div class="order" id="order" role="dialog" aria-modal="true" aria-labelledby="o-title">
  <div class="ohead"><h2 id="o-title"></h2><button id="o-back" class="oback"></button></div>
  <p class="gnote" id="o-show"></p>
  <div id="o-list"></div>
  <div id="o-foot"></div>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="s-title">
  <div class="scrim" id="scrim"></div>
  <div class="panel">
    <button class="close" id="close" aria-label="Закрыть">×</button>
    <div class="big" id="s-img"></div>
    <div class="body">
      <h3 id="s-title"></h3>
      <p id="s-desc"></p>
      <div class="meta"><span class="w" id="s-w" style="flex:1"></span><span class="sp" id="s-p"></span></div>
      <p class="hint" id="s-hint"></p>
    </div>
  </div>
</div>

<script>
{
const UI={
 ru:{tag:"Кафе · бар · кофе",hours:"Пн–Вс 10:00–23:00",kitchen:"Кухня до 21:00",kitchenOff:"Кухня закрыта до 10:00",q:"Найти блюдо или напиток",empty:"Ничего не нашлось",addrH:"Адрес",addr:"Минск, ул. Карла Маркса, 21",hoursH:"Часы работы",hoursF:"Каждый день 10:00–23:00<br>Кухня до 21:00",bookH:"Бронь столика",book:"Напишите нам в директ Instagram",demo:"Демо-версия. Цены в белорусских рублях. Актуальные цены и наличие уточняйте у персонала.",hint:"Нажмите «+», чтобы добавить в заказ, а затем покажите заказ официанту.",hintOff:"Кухня уже закрыта — это блюдо можно заказать завтра с 10:00.",cur:"BYN",ask:"цена у бариста",load:"Не удалось загрузить меню. Обновите страницу.",
  my:"Мой заказ",pos:n=>n+" "+(n%10==1&&n%100!=11?"позиция":n%10>=2&&n%10<=4&&(n%100<10||n%100>=20)?"позиции":"позиций"),show:"Покажите этот экран официанту",total:"Итого",extra:"+ позиции с ценой у бариста",clear:"Очистить заказ",sure:"Точно очистить?",emptyCart:"Заказ пуст. Нажмите «+» у блюда или напитка.",add:"Добавить",less:"Убрать",back:"К меню",closedNote:"Кухня закрыта — блюда кухни можно будет заказать с 10:00."},
 en:{tag:"Cafe · bar · coffee",hours:"Daily 10:00–23:00",kitchen:"Kitchen until 21:00",kitchenOff:"Kitchen closed until 10:00",q:"Search dishes and drinks",empty:"Nothing found",addrH:"Address",addr:"21 Karla Marksa St, Minsk",hoursH:"Opening hours",hoursF:"Every day 10:00–23:00<br>Kitchen until 21:00",bookH:"Book a table",book:"Send us a DM on Instagram",demo:"Demo version. Prices in Belarusian roubles. Please check current prices and availability with our staff.",hint:"Tap “+” to add it to your order, then show the order to your waiter.",hintOff:"The kitchen is closed — this dish is available tomorrow from 10:00.",cur:"BYN",ask:"ask the barista",load:"Couldn't load the menu. Please refresh the page.",
  my:"My order",pos:n=>n+(n==1?" item":" items"),show:"Show this screen to your waiter",total:"Total",extra:"+ items priced by the barista",clear:"Clear order",sure:"Clear for sure?",emptyCart:"Your order is empty. Tap “+” next to a dish or drink.",add:"Add",less:"Remove",back:"Back to menu",closedNote:"The kitchen is closed — kitchen dishes can be ordered from 10:00."}
};
let CATS=[],INDEX={},cart={},sheetKey=null;
let lang="ru";try{lang=localStorage.getItem("vk-lang")||"ru"}catch(e){}
try{cart=JSON.parse(localStorage.getItem("vk-cart")||"{}")||{}}catch(e){cart={}}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const unit=w=>!w?"":lang==="en"?w.replace(/бокал/g,"glass").replace(/хлеб/g,"bread").replace(/сметана/g,"sour cream").replace(/мл/g,"ml").replace(/г/g,"g"):w;
const num=p=>Number.isInteger(p)?String(p):p.toFixed(2).replace(".",lang==="ru"?",":".");
const img=k=>`img/${k}.jpg`;
const keyOf=(c,it,vi)=>c.id+":"+it.ru[0]+(vi==null?"":"|"+vi);
const qty=k=>cart[k]||0;
function priceOf(it){const t=UI[lang];
 if(it.v)return it.v.map(x=>num(x[1])).join(" / ")+" "+t.cur;
 return it.p==null?t.ask:num(it.p)+" "+t.cur}
function weightOf(it){return it.v?unit(it.v.map(x=>x[0].replace(/ мл/,"")).join(" / ")+" мл"):unit(it.w)}
function kitchenOpen(){const h=+new Intl.DateTimeFormat("en-GB",{hour:"numeric",hourCycle:"h23",timeZone:"Europe/Minsk"}).format(new Date());return h>=10&&h<21}
function matches(it,q){return !q||(it.ru.join(" ")+" "+it.en.join(" ")).toLowerCase().includes(q)}
function stepper(k,off,big){const n=qty(k),t=UI[lang];
 if(off)return"";
 if(!n)return`<span class="step${big?" lg":""}"><button class="pl" data-add="${esc(k)}" aria-label="${t.add}">+</button></span>`;
 return`<span class="step on${big?" lg":""}"><button data-sub="${esc(k)}" aria-label="${t.less}">−</button><b>${n}</b><button data-add="${esc(k)}" aria-label="${t.add}">+</button></span>`}
function itemQty(c,it){return it.v?it.v.reduce((s,_,vi)=>s+qty(keyOf(c,it,vi)),0):qty(keyOf(c,it))}
function save(){try{localStorage.setItem("vk-cart",JSON.stringify(cart))}catch(e){}}
function change(k,d){const e=INDEX[k];if(!e)return;if(d>0&&e.c.kitchen&&!kitchenOpen())return;
 cart[k]=Math.max(0,qty(k)+d);if(!cart[k])delete cart[k];save();render();if(sheetKey)fillSheet();if($("order").classList.contains("open"))renderOrder()}
function totals(){let n=0,sum=0,unk=false;for(const k in cart){const e=INDEX[k];if(!e)continue;n+=cart[k];const p=e.vi!=null?e.it.v[e.vi][1]:e.it.p;if(p==null)unk=true;else sum+=p*cart[k]}return{n,sum:Math.round(sum*100)/100,unk}}
function render(){
 const t=UI[lang],q=$("q").value.trim().toLowerCase(),open=kitchenOpen();
 document.documentElement.lang=lang;
 document.querySelectorAll("[data-t]").forEach(el=>{el.innerHTML=t[el.dataset.t]});
 $("kitchen").textContent=open?t.kitchen:t.kitchenOff;$("kitchen").classList.toggle("warn",!open);
 $("q").placeholder=t.q;$("l-ru").setAttribute("aria-pressed",lang==="ru");$("l-en").setAttribute("aria-pressed",lang==="en");
 let shown=0;
 $("menu").innerHTML=CATS.map((c,ci)=>{
  const off=c.kitchen&&!open;
  const groups=c.groups.map((g,gi)=>{
   const items=g.items.map((it,ii)=>({it,ii})).filter(({it})=>matches(it,q));
   if(!items.length)return"";shown+=items.length;
   const head=(g[lang]?`<h3 class="grp">${esc(g[lang])}</h3>`:"")+(g.note?`<p class="gnote">${esc(g.note[lang])}</p>`:"");
   if(g.compact)return head+`<div class="rows${off?" off":""}">${items.map(({it})=>{const k=keyOf(c,it);return`<div class="row${qty(k)?" sel":""}"><span class="n">${esc(it[lang][0])}<span class="w"> · ${weightOf(it)}</span></span><span class="price">${priceOf(it)}</span>${stepper(k,off)}</div>`}).join("")}</div>`;
   return head+`<div class="list">${items.map(({it,ii})=>{const [n,d]=it[lang],k=keyOf(c,it),iq=itemQty(c,it);
    const st=off?"":it.v?`<span class="step${iq?" on":""}"><button class="pl" data-open="${ci}/${gi}/${ii}" aria-label="${t.add}">${iq?iq+" ›":"+"}</button></span>`:stepper(k,false);
    return`<div class="item${off?" off":""}${iq?" sel":""}"><button class="open" data-open="${ci}/${gi}/${ii}">${it.img?`<span class="ph"><img src="${img(it.img)}" alt="" loading="lazy"></span>`:""}<span class="info"><h3>${esc(n)}</h3>${d?`<p>${esc(d)}</p>`:""}<span class="meta"><span class="w">${weightOf(it)}</span><span class="price">${priceOf(it)}</span></span></span></button>${st}</div>`}).join("")}</div>`}).join("");
  if(!groups)return"";
  return`<section id="${c.id}"><h2>${esc(c[lang])}</h2><p class="note">${c.note?esc(c.note[lang]):""}</p>${groups}</section>`}).join("");
 $("empty").style.display=shown||!CATS.length?"none":"block";
 $("cats").innerHTML=CATS.filter(c=>$(c.id)).map(c=>`<button data-go="${c.id}">${esc(c[lang])}</button>`).join("");
 const tt=totals();
 $("cartbar").hidden=!tt.n;document.body.classList.toggle("hascart",!!tt.n);
 $("cartbar").innerHTML=`<span><b>${t.my}</b> · ${t.pos(tt.n)}</span><span class="price">${num(tt.sum)} ${t.cur}${tt.unk?" +":""}</span>`;
 spy();
}
function fillSheet(){const t=UI[lang],c=sheetKey.c,it=sheetKey.it,off=c.kitchen&&!kitchenOpen();
 $("s-img").innerHTML=it.img?`<img src="${img(it.img)}" alt="">`:"";$("s-img").style.display=it.img?"":"none";
 $("s-title").textContent=it[lang][0];$("s-desc").textContent=it[lang][1];
 if(it.v){$("s-w").innerHTML=`<div class="vars">${it.v.map((x,vi)=>`<div><span>${unit(x[0])}</span><span class="vr"><span class="price">${num(x[1])} ${t.cur}</span>${stepper(keyOf(c,it,vi),off,true)}</span></div>`).join("")}</div>`;$("s-p").innerHTML=""}
 else{$("s-w").textContent=unit(it.w);$("s-p").innerHTML=`<span class="price">${priceOf(it)}</span>${stepper(keyOf(c,it),off,true)}`}
 $("s-hint").textContent=off?t.hintOff:t.hint}
function openSheet(path){const [ci,gi,ii]=path.split("/").map(Number),c=CATS[ci];sheetKey={c,it:c.groups[gi].items[ii]};fillSheet();
 $("sheet").classList.add("open");document.body.style.overflow="hidden";$("close").focus()}
function renderOrder(){const t=UI[lang],tt=totals();$("o-title").textContent=t.my;$("o-show").textContent=t.show;$("o-back").textContent=t.back;
 if(!tt.n){$("o-list").innerHTML=`<p class="oempty">${t.emptyCart}</p>`;$("o-foot").innerHTML="";return}
 const closed=!kitchenOpen()&&Object.keys(cart).some(k=>INDEX[k]&&INDEX[k].c.kitchen);
 $("o-list").innerHTML=(closed?`<p class="owarn">${t.closedNote}</p>`:"")+CATS.map(c=>{const ks=Object.keys(cart).filter(k=>INDEX[k]&&INDEX[k].c===c);if(!ks.length)return"";
  return`<h3 class="grp">${esc(c[lang])}</h3><div class="rows">${ks.map(k=>{const e=INDEX[k],p=e.vi!=null?e.it.v[e.vi][1]:e.it.p,n=cart[k];
   return`<div class="row ord"><span class="n"><b class="x">${n}×</b> ${esc(e.it[lang][0])}${e.vi!=null?`<span class="w"> · ${unit(e.it.v[e.vi][0])}</span>`:""}</span><span class="price">${p==null?"—":num(Math.round(p*n*100)/100)}</span>${stepper(k,false)}</div>`}).join("")}</div>`}).join("");
 $("o-foot").innerHTML=`<div class="otot"><span>${t.total}</span><span class="price">${num(tt.sum)} ${t.cur}</span></div>${tt.unk?`<p class="gnote">${t.extra}</p>`:""}<button class="clr" id="o-clear">${t.clear}</button>`}
function setLang(l){lang=l;try{localStorage.setItem("vk-lang",l)}catch(e){}render();if(sheetKey)fillSheet();if($("order").classList.contains("open"))renderOrder()}
$("l-ru").onclick=()=>setLang("ru");$("l-en").onclick=()=>setLang("en");
$("q").oninput=()=>{$("qx").style.display=$("q").value?"block":"none";render()};
$("qx").onclick=()=>{$("q").value="";$("qx").style.display="none";render();$("q").focus()};
$("cats").onclick=e=>{const b=e.target.closest("[data-go]");if(b)$(b.dataset.go).scrollIntoView({behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"})};
function spy(){let cur=null;for(const c of CATS){const s=$(c.id);if(s&&s.getBoundingClientRect().top<140)cur=c.id}
 if(!cur){const f=CATS.find(c=>$(c.id));if(f)cur=f.id}
 document.querySelectorAll("#cats button").forEach(b=>{const on=b.dataset.go===cur;if(on&&!b.classList.contains("on"))b.scrollIntoView({block:"nearest",inline:"center"});b.classList.toggle("on",on)})}
addEventListener("scroll",spy,{passive:true});
document.addEventListener("click",e=>{
 const a=e.target.closest("[data-add]"),s=e.target.closest("[data-sub]"),o=e.target.closest("[data-open]");
 if(a){change(a.dataset.add,1);return}if(s){change(s.dataset.sub,-1);return}
 if(o){openSheet(o.dataset.open);return}
 if(e.target.id==="o-clear"){const b=e.target;if(b.dataset.arm){cart={};save();render();renderOrder()}else{b.dataset.arm=1;b.textContent=UI[lang].sure;b.classList.add("arm")}}});
const shut=()=>{sheetKey=null;$("sheet").classList.remove("open");$("order").classList.remove("open");document.body.style.overflow=""};
$("close").onclick=shut;$("scrim").onclick=shut;$("o-back").onclick=shut;
$("cartbar").onclick=()=>{renderOrder();$("order").classList.add("open");document.body.style.overflow="hidden";$("o-back").focus()};
addEventListener("keydown",e=>{if(e.key==="Escape")shut()});
render();
fetch("menu.json").then(r=>r.json()).then(d=>{CATS=d;
 for(const c of CATS)for(const g of c.groups)for(const it of g.items){if(it.v)it.v.forEach((_,vi)=>INDEX[keyOf(c,it,vi)]={c,it,vi});else INDEX[keyOf(c,it)]={c,it,vi:null}}
 for(const k in cart)if(!INDEX[k])delete cart[k];render()}).catch(()=>{$("menu").innerHTML=`<p class="empty" style="display:block">${UI[lang].load}</p>`});

}
</script>
</body>
</html>
